# Deploys the Work sync server on Coolify.
#
# Point a Coolify "Docker Compose" resource at this repository with this file
# as its compose path. Coolify builds the image from the Dockerfile beside it,
# puts both containers on its own network, and publishes only the one that
# asks to be published.
#
# Nothing here names an environment. The domain, the database password and the
# signup token are all per-application state that Coolify holds, so the same
# file deployed a second time is a second environment rather than a second
# claim on the first one's hostname.
#
# The SERVICE_* names below are Coolify's, not Docker's. Coolify substitutes
# them before compose ever sees the file: SERVICE_FQDN_* claims a domain and
# wires the proxy and its certificate, SERVICE_PASSWORD_* and SERVICE_BASE64_*
# generate a secret once and keep it for the life of the resource. That is
# what keeps every credential here out of the repository -- there is no .env
# to forget to gitignore, because there are no literal secrets to put in one.

services:
  server:
    build:
      # The root, not server/. server/ is its own Go module and reaches up
      # into internal/ops; see the Dockerfile.
      context: .
      dockerfile: Dockerfile
    # Not just for crashes: this is also what recovers the ungated starts
    # described under depends_on.
    restart: unless-stopped
    environment:
      # Marks this service as the published one and terminates TLS in front
      # of port 8080. Deliberately valueless: the hostname is per-application
      # state that Coolify keeps in the resource's own docker_compose_domains,
      # and writing one here would make a second deployment of this same
      # branch claim the first one's domain.
      #
      # The _8080 suffix is not decoration. Coolify strips it into the port it
      # points the proxy at and stores the domain under the bare
      # SERVICE_FQDN_SERVER; there is no ports: or expose: block below for it
      # to fall back on, so the suffix is the only statement of which port
      # serves HTTP. The name stays even though the value goes.
      - SERVICE_FQDN_SERVER_8080

      # sslmode=disable is correct here and only here: the connection never
      # leaves Coolify's internal network, and asking for TLS to a sidecar on
      # a private bridge buys nothing but a handshake. Pointing this at
      # anything reachable from outside that network means sslmode=require.
      - DATABASE_URL=postgres://work:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/work?sslmode=disable

      # Gates workspace creation. Coolify generates 64 bytes once and keeps
      # it; read it out of the resource's environment when creating the first
      # workspace, and unset this afterwards to close signup for good.
      - WORK_SIGNUP_TOKEN=${SERVICE_BASE64_64_SIGNUP}

      # info logs failures and lifecycle. Successful requests are debug on
      # purpose -- a viewer polling every few seconds would otherwise be the
      # entire log.
      - WORK_LOG_LEVEL=info
      - PORT=8080
    depends_on:
      postgres:
        # The server migrates before it opens its listener and exits if the
        # database will not take a connection, so it has to start second.
        # This gate is what a deploy uses -- Coolify runs `up`, and `up`
        # honours it: verified by a full down/up cycle coming back with a
        # single "listening" line and no error.
        #
        # It does not cover every start. `compose restart`, and a host
        # rebooting both containers at once, bring them up together with no
        # gate at all; the server then loses the race, exits on
        # "the database system is starting up", and comes back on the restart
        # policy below a second or two later. That self-heals, and it is
        # still worth a line in the server's own startup to retry the first
        # connection rather than relying on it.
        condition: service_healthy
    healthcheck:
      # Same check as the Dockerfile's, restated so Coolify's rollout can see
      # it: a deploy is not finished until /v1/health has done a real
      # database round trip.
      test: ["CMD-SHELL", "wget --quiet --spider --tries=1 http://127.0.0.1:8080/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Postgres runs alongside the server, on the same Coolify instance.
  #
  # To use a Postgres that Coolify already manages instead, delete this
  # service and the volume, drop the depends_on above, and set DATABASE_URL to
  # that database's internal connection string -- Coolify shows it on the
  # database resource. Nothing else changes: the server owns its schema and
  # migrates at startup either way.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=work
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=work
      # The server's own schema lives in its migrations. This only sets the
      # encoding and collation the database is created with, which cannot be
      # changed afterwards without recreating it.
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - work-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work -d work"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    # Deliberately no ports. The database is reachable from the server over
    # Coolify's internal network and from nowhere else; publishing it would
    # put a password-only Postgres on the public internet.

  # ---------------------------------------------------------------------------
  # The local dev stack.
  #
  # Everything above is what Coolify deploys, and it deploys it because those
  # services have no `profiles:` key -- compose runs an unprofiled service
  # always and a profiled one only when its profile is asked for. So the three
  # services below are invisible to a deploy and are brought up by hand:
  #
  #     docker compose --profile dev up -d --build server-dev
  #
  # Named, rather than a bare `up`: an unprofiled service is *always* active,
  # so a bare `up --profile dev` would also start the two Coolify owns -- with
  # no SERVICE_PASSWORD_POSTGRES to substitute, which is a Postgres with a
  # blank password and a server that cannot reach it. Naming one service
  # starts it and its depends_on, which is exactly the three below.
  #
  # They are separate services rather than an override of the two above, which
  # is the only shape that keeps one file honest for both. An override would
  # mean the file Coolify reads and the file a laptop reads differ by whatever
  # somebody remembered to guard, and the guard that gets forgotten is the one
  # that publishes a port or reuses production's volume.
  #
  # What this gives you:
  #
  #   - the server on http://localhost:8080, which is what to type into the
  #     desktop app's "join a workspace" field. http:// is deliberate and
  #     allowed for exactly this; see cleanServerURL in
  #     internal/workbench/workspace.go.
  #   - WORK_SIGNUP_TOKEN=dev, so creating the first workspace needs no secret
  #     to be read out of anywhere.
  #   - Postgres on 127.0.0.1:5432 with a `work_test` database beside the dev
  #     one, which is what TEST_DATABASE_URL points at:
  #
  #       export TEST_DATABASE_URL=postgres://work:work@127.0.0.1:5432/work_test?sslmode=disable
  #       cd server && go test ./...
  #
  #     Without that variable the store's tests skip themselves, which is the
  #     right default and a bad surprise; see .github/workflows/ci.yml.
  # ---------------------------------------------------------------------------

  server-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    # Published, unlike the production service, which is reached through
    # Coolify's proxy and has no ports block at all. Bound to the loopback
    # address on purpose: a dev server with an open signup token has no
    # business being reachable from the coffee shop's network.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DATABASE_URL=postgres://work:work@postgres-dev:5432/work?sslmode=disable
      # Not a secret and not pretending to be one. Production reads a 64-byte
      # value Coolify generated; this is a word you can type.
      - WORK_SIGNUP_TOKEN=dev
      # debug, unlike production: locally the successful requests are the
      # interesting ones -- they are how you see the desktop app polling.
      - WORK_LOG_LEVEL=debug
      - PORT=8080
    depends_on:
      postgres-dev:
        condition: service_healthy
      postgres-dev-init:
        # The test database has to exist before anything runs the tests, and
        # this is the only ordering that says so. The server itself does not
        # need it -- it migrates its own schema into `work`.
        condition: service_completed_successfully

  postgres-dev:
    profiles: ["dev"]
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=work
      - POSTGRES_PASSWORD=work
      - POSTGRES_DB=work
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    # tmpfs rather than the named volume above, and rather than a volume of
    # its own. A dev database is meant to be thrown away -- the schema comes
    # from the server's migrations every start -- and keeping it in memory
    # makes the test suite's round trips noticeably quicker than they are
    # against a disk-backed one. It also removes any chance of a dev stack
    # and a production stack ever sharing the volume that holds the op log.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work -d work"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  postgres-dev-init:
    profiles: ["dev"]
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment:
      - PGPASSWORD=work
    # server/store's tests want a database of their own, and the official
    # image creates exactly one. Idempotent rather than conditional on a
    # volume that no longer exists: with tmpfs above this runs from empty
    # every time, and the check costs one query if somebody restarts the
    # container without recreating it.
    entrypoint:
      - sh
      - -c
      - >-
        psql -h postgres-dev -U work -d work -tAc
        "select 1 from pg_database where datname = 'work_test'" | grep -q 1
        || createdb -h postgres-dev -U work work_test

volumes:
  # The append-only op log is the only state this deployment has, and losing
  # it loses every workspace. A named volume survives a redeploy and a
  # container rebuild; it does not survive deleting the resource, so this is
  # what a backup schedule points at.
  work-postgres:
