version: '3'

vars:
  APP_NAME: "work"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  goroot:check:
    internal: true
    summary: Refuses to build with a GOROOT belonging to a different Go install
    # The go command resolves its compiler as
    # $GOROOT/pkg/tool/<goos>_<goarch>/compile and passes its own version to it
    # as -goversion. An inherited GOROOT from a *different* install therefore
    # pairs one Go's driver with another Go's compiler, and every package in the
    # standard library fails with
    #
    #     compile: version "go1.27.1" does not match go tool version "go1.25.5"
    #
    # which names neither the variable nor the two installs it is talking about.
    # It is not a go.mod or toolchain problem: the same go.mod builds cleanly the
    # moment the two agree, and it reproduces in both directions.
    #
    # Checked rather than corrected because task cannot correct it -- an
    # inherited environment variable wins over both `env:` blocks, so the only
    # thing this file can do about it is refuse to run and say why. Correcting it
    # here would also be the wrong place: a GOROOT this broken breaks `go build`,
    # `go test` and gopls outside task just as thoroughly, so it wants fixing
    # where it is set, not hiding per repository.
    #
    # Nothing to do in the normal case: no modern Go needs GOROOT set at all.
    preconditions:
      # Entirely inside the precondition, and entirely lazy. An earlier version
      # of this computed the comparison in a top-level `vars` entry, which task
      # evaluates on every invocation of every task -- so a machine with no go
      # on PATH could not run `task verify:office`, or even `task --list`,
      # without the whole file failing on `go env`. A check nothing else depends
      # on has no business being in the critical path of tasks that never touch
      # Go.
      - sh: |
          # No GOROOT is the healthy case, and the common one.
          test -z "$GOROOT" && exit 0
          # No go at all is somebody else's error to report, and a much clearer
          # one: the go command says so itself.
          command -v go >/dev/null 2>&1 || exit 0
          test "$GOROOT" = "$(unset GOROOT; go env GOROOT)"
        msg: |
          GOROOT points at a different Go install than the go on PATH:

            GOROOT              {{.GOROOT}}
            go env GOROOT (own) run `unset GOROOT; go env GOROOT` to see it

          Building with both fails on every package in the standard library
          with "compile: version ... does not match go tool version ...",
          because the go command loads its compiler from
          $GOROOT/pkg/tool/<goos>_<goarch>/compile and then hands it its own
          version. Unset it -- no modern Go needs it set:

            unset GOROOT

          If a version manager exports it (mise sets GOROOT to the install it
          currently resolves, which goes stale in a shell that captured the
          previous one), open a fresh shell or stop it exporting the variable.

  build:
    summary: Builds the application
    deps:
      - task: goroot:check
    cmds:
      - task: "{{.GOOS}}:build"

  build:release:
    summary: Builds a release binary with its version stamped in
    desc: |
      Builds the same production binary as `task build`, plus the version, so
      the running app knows which release it is and can tell whether a newer
      one exists.

      The version comes from VERSION in the environment if it is set, and from
      info.version in build/config.yml otherwise. The release workflow always
      sets VERSION: it derives it by incrementing the newest v* tag, so the
      number in the binary, the tag in GitHub and the number the app reports
      are all the same one and none of them is maintained by hand. The
      config.yml value is only the fallback for building a release binary
      locally.

      Usage: task build:release [VERSION=0.2.0] [OUTPUT=bin/work]

      This does not go through {{.GOOS}}:build the way `task build` does,
      because the two want different versions: that path stamps a git
      description on a "dev" core, which internal/update reads as a
      development build and never offers to replace, and this one stamps the
      real release number that opts into the update check. The flags otherwise
      match build:native's production build exactly.
    deps:
      - task: goroot:check
      - task: common:build:frontend
        vars:
          BUILD_FLAGS: "-tags production"
    cmds:
      - echo "building {{.APP_NAME}} {{.BUILD_VERSION}} for {{.GOOS}}/{{.TARGET_ARCH}}"
      - >-
        go build -tags production -trimpath -buildvcs=false
        -ldflags="-w -s -X main.version={{.BUILD_VERSION}}"
        -o {{.OUTPUT}}
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      # Read from the environment rather than as a task variable, because a
      # task variable declared here would win over the one the caller passes
      # and there would be no way to override it at all.
      BUILD_VERSION:
        sh: |
          set -eu
          if [ -n "${VERSION:-}" ]; then
            printf %s "$VERSION"
            exit 0
          fi
          # Exactly two leading spaces, which is info.version and not the
          # top-level `version: '3'` or the commented-out iOS block.
          version=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' build/config.yml | head -n 1)
          test -n "$version" || { echo "no info.version in build/config.yml" >&2; exit 1; }
          printf %s "$version"
    env:
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    deps:
      - task: goroot:check
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  check:
    summary: Typechecks the frontend and vets the Go code
    deps:
      - task: goroot:check
      - task: common:generate:bindings
      - task: common:install:frontend:deps
    cmds:
      - go vet ./...
      - "{{.PACKAGE_MANAGER}} --prefix frontend run check"

  test:
    summary: Runs the Go test suite
    deps:
      - task: goroot:check
    cmds:
      - go test ./...

  sync:up:
    summary: Starts the local sync server and its Postgres
    desc: |
      Brings up docker-compose.dev.yml: the sync server on
      http://localhost:8080 and Postgres on 127.0.0.1:5432, with a `work_test`
      database beside the dev one for `task test:server`.

      http://localhost:8080 is what to type into the desktop app's join
      dialog, and the signup token is the word "dev". Nothing here is shared with the deployment. They are in
      their own file because Coolify parses the one it deploys to work out
      what the application is, and extra services in it were enough for it to
      re-derive the domain and drop work.jevido.app off the proxy.

      The database is in tmpfs, so `task sync:down` is also how you reset it.
    cmds:
      # server-dev by name, not a bare `up`: compose treats a service with no
      # profile as always active, so a bare one would also start the two
      # services Coolify deploys -- with nothing to substitute for their
      # password. Naming this one starts it and its depends_on and nothing
      # else. See the comment in docker-compose.yml.
      - docker compose -f docker-compose.dev.yml up -d --build server-dev
      # Quoted whole. Without the outer quotes YAML sees the ": " in
      # "(signup token: dev)" and reads the line as a mapping rather than a
      # string, and task then refuses the file with "invalid keys in command"
      # -- which is a broken Taskfile, not a broken task, and takes the build
      # with it.
      - 'echo "sync server on http://localhost:8080 (signup token: dev)"'

  sync:down:
    summary: Stops the local sync server and discards its database
    cmds:
      # By name for the same reason, and `down` is enough to discard the
      # database: it lives in tmpfs, not in the named volume the deployment
      # uses.
      - docker compose -f docker-compose.dev.yml down

  sync:logs:
    summary: Follows the local sync server's log
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f server-dev

  test:server:
    summary: Runs the sync server's tests against the local Postgres
    desc: |
      server/ is its own Go module, so `task test` does not reach it, and its
      store tests skip themselves unless TEST_DATABASE_URL is set -- which is
      the right default and a bad surprise. This sets it, and sets
      WORK_REQUIRE_POSTGRES so a database that is configured and unreachable
      fails instead of passing as "nothing to run". Same pair as
      .github/workflows/ci.yml.

      Needs `task sync:up` first: the database it points at is that stack's.
    dir: server
    deps:
      - task: goroot:check
    env:
      # 127.0.0.1 rather than localhost, for the reason ci.yml gives: the port
      # is published on IPv4 only, and a resolver answering ::1 first turns
      # this into a connection refused that reads like a broken test.
      TEST_DATABASE_URL: postgres://work:work@127.0.0.1:5432/work_test?sslmode=disable
      WORK_REQUIRE_POSTGRES: "1"
    cmds:
      - go test -race -count=1 ./...

  verify:board:
    summary: Photographs the board in WebKitGTK, dark and light
    # verify:map answers where the boxes are; this answers what they look like.
    # Paint is the half of a canvas a pure test cannot reach -- a shadow, a
    # tilt, a piece of tape, text that fits its paper -- and the only honest way
    # to check it is to look at one. Writes PNGs and leaves them; reading them
    # is the point.
    #
    # Needs WebKitGTK and its Python bindings, the same as the other shot
    # harnesses. Offscreen, so it steals no window.
    dir: frontend
    vars:
      OUT: '{{.OUT | default "../.tmp-verify"}}'
    env:
      # The offscreen window has no GL context on most desktops, and WebKit
      # aborts rather than falling back on its own.
      WEBKIT_DISABLE_COMPOSITING_MODE: 1
      LIBGL_ALWAYS_SOFTWARE: 1
      GDK_BACKEND: x11
    cmds:
      - |
        npx vite --config .verify/vite.config.ts >/dev/null 2>&1 &
        vite=$!
        trap "kill $vite 2>/dev/null" EXIT
        for _ in $(seq 1 60); do
          curl -sf http://127.0.0.1:9345/.verify/board.html >/dev/null && break
          sleep 0.25
        done
        python3 .verify/webkit_shots.py http://127.0.0.1:9345/.verify/board.html {{.OUT}}
      - 'echo "shots in {{.OUT}}"'

  verify:cards:
    summary: Photographs the card and vocabulary dialogs in WebKitGTK
    # The same trick as verify:board, on the two panels rather than the canvas.
    # They are mounted against a stub document -- what is being checked is
    # whether a card carrying four guidelines, two captioned links and a
    # paragraph still fits, and whether the same panel reads right on a card
    # carrying none of it. Neither question needs an op log behind it.
    dir: frontend
    vars:
      OUT: '{{.OUT | default "../.tmp-verify"}}'
    env:
      WEBKIT_DISABLE_COMPOSITING_MODE: 1
      LIBGL_ALWAYS_SOFTWARE: 1
      GDK_BACKEND: x11
    cmds:
      - |
        npx vite --config .verify/vite.config.ts >/dev/null 2>&1 &
        vite=$!
        trap "kill $vite 2>/dev/null" EXIT
        for _ in $(seq 1 60); do
          curl -sf http://127.0.0.1:9345/.verify/cards.html >/dev/null && break
          sleep 0.25
        done
        python3 .verify/webkit_shots.py http://127.0.0.1:9345/.verify/cards.html {{.OUT}}
      - 'echo "shots in {{.OUT}}"'

  verify:map:
    summary: Checks the map's geometry with no canvas and no browser
    # lib/mindmap/layout.ts is pure -- rows and a text measurement in,
    # rectangles out -- so the questions worth asking of it are answered by
    # calling it, not by looking at a screenshot. Same shape as verify:office
    # below, and for the same reason: emitted as CommonJS into a folder of its
    # own, because tsc writes bare specifiers node's ESM loader will not
    # resolve.
    dir: frontend
    vars:
      OUT: node_modules/.map-verify
    cmds:
      - rm -rf {{.OUT}}
      - npx tsc .verify/map.ts --outDir {{.OUT}} --module commonjs --target es2022 --moduleResolution node --skipLibCheck
      - printf '{"type":"commonjs"}' > {{.OUT}}/package.json
      - node {{.OUT}}/.verify/map.js

  verify:office:
    summary: Drives the office's scripted sequences without a browser
    # The simulation is plain TypeScript with no DOM in it, so this compiles
    # that subgraph on its own and steps it in node -- which runs a handoff and
    # a rally in a second apiece instead of the minute each takes on screen.
    # Emitted as CommonJS into a folder of its own, because tsc writes bare
    # specifiers that node's ESM loader will not resolve.
    dir: frontend
    vars:
      OUT: node_modules/.office-verify
    cmds:
      - rm -rf {{.OUT}}
      - npx tsc .verify/sequences.ts --outDir {{.OUT}} --module commonjs --target es2022 --moduleResolution node --skipLibCheck
      - printf '{"type":"commonjs"}' > {{.OUT}}/package.json
      - node {{.OUT}}/.verify/sequences.js

