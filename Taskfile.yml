version: '3'

# The monorepo's front door.
#
# One program per directory and one rule about which directory: apps/ is what a
# person opens, services/ is what runs without anyone looking at it, packages/
# is what two of them share. The tasks here are the ones that span more than
# one of those -- everything else is delegated, so `task studio:build` is the
# app's own Taskfile answering for itself.
#
# Go is one module rooted here, so `go build ./...` and `go test ./...` at the
# root cover the app and the services together. That is deliberate: the sync
# server used to be its own module with a `replace ../` back into the app, and
# a shared package behind a replace directive is a dependency nobody can see
# from either side.

includes:
  studio:
    taskfile: ./apps/studio/Taskfile.yml
    dir: ./apps/studio
  website:
    taskfile: ./apps/website/Taskfile.yml
    dir: ./apps/website
  charted:
    taskfile: ./apps/charted/Taskfile.yml
    dir: ./apps/charted

tasks:
  default:
    summary: Lists what there is
    cmds:
      # TASK_EXE rather than a literal `task`: this same file is run both by
      # Task itself and by `wails3 task`, which embeds it, and a machine that
      # took the second route has no `task` on PATH at all.
      - '{{.TASK_EXE}} --list'

  up:
    summary: Starts everything that runs in the background, and says what to open
    desc: |
      The two services and their databases, in Docker, from infra/dev.

      This is the half of the system nothing else can stand in for: the desktop
      app joins a sync server, and documentation mode publishes to a Charted.
      The parts you look at -- the desktop app, the two readers -- are separate
      commands, because each of them wants a terminal of its own.

      Everything here is local and disposable. Both databases live in tmpfs, so
      `task down` is also how you reset them, and both tokens are the word
      "dev" because nothing is reachable from outside this machine.
    cmds:
      # --project-directory, because every build context in that file is `.`
      # meaning the repository root. Without it compose resolves relative paths
      # against the compose file's own directory and the builds see infra/dev
      # instead. Coolify resolves them from the root too, so this is the one
      # spelling that means the same thing in both places.
      - docker compose --project-directory . -f infra/dev/compose.yml up -d --build server-dev charted-dev
      # Waited for rather than assumed. `up -d` returns when the containers have
      # started, which is before Postgres has accepted a connection and before
      # the migrations have run -- so a board printed straight after it names
      # URLs that answer "connection refused" for another ten seconds.
      - cmd: |
          for port in 8080 8081; do
            for _ in $(seq 60); do
              curl -fsS "http://localhost:$port/v1/health" >/dev/null 2>&1 && break
              sleep 1
            done
          done
        silent: true
      - cmd: |
          cat <<'BOARD'

          Running:
            sync server     http://localhost:8080     signup token: devdevdevdevdevdevdevdevdev
            charted         http://localhost:8081     write token:  dev
            postgres        127.0.0.1:5432 work/work  (plus work_test)
            charted's own   127.0.0.1:5433 charted/charted

          Now pick what you are working on:
            task dev              the desktop app, with the services behind it
            task website:dev      the viewer          http://localhost:5175
            task charted:dev      the docs reader     http://localhost:5176

          In the app's join dialog: http://localhost:8080, and that token.
          BOARD
        silent: true

  dev:
    summary: Everything up, then the desktop app in the foreground
    desc: |
      What to run when you are working on Work itself. It brings the services up
      if they are not already -- `up` is idempotent -- and then hands the
      terminal to the desktop app with live reload.

      The first start asks for a config folder. Pick an empty directory; Work
      writes the team into it and never touches your project's files to do it.
    cmds:
      - task: up
      - task: studio:dev

  down:
    summary: Stops everything and discards both databases
    cmds:
      - docker compose --project-directory . -f infra/dev/compose.yml down

  logs:
    summary: Follows both services at once
    cmds:
      - docker compose --project-directory . -f infra/dev/compose.yml logs -f server-dev charted-dev

  status:
    summary: What is up, and on which port
    cmds:
      - docker compose --project-directory . -f infra/dev/compose.yml ps

  build:
    summary: Builds every program in the repository
    cmds:
      - task: studio:build
      - task: website:build
      - task: charted:build
      - go build ./services/...

  test:
    summary: Runs the Go tests for the whole module
    cmds:
      - go test ./...

  check:
    summary: Vets the Go and typechecks every front end
    cmds:
      - go vet ./...
      - task: studio:check
      - task: website:check
      - task: charted:check

  sync:up:
    summary: Starts the local sync server and its Postgres
    desc: |
      Brings up infra/dev/compose.yml: the sync server on
      http://localhost:8080 and Postgres on 127.0.0.1:5432, with a `work_test`
      database beside the dev one for `task test:server`.

      http://localhost:8080 is what to type into the desktop app's join
      dialog, and the signup token is devdevdevdevdevdevdevdevdev -- the word "dev" repeated,
      because the server refuses a token under 24 characters. Nothing here is shared with the deployment. They are in
      their own file because Coolify parses the one it deploys to work out
      what the application is, and extra services in it were enough for it to
      re-derive the domain and drop work.jevido.app off the proxy.

      The database is in tmpfs, so `task sync:down` is also how you reset it.
    cmds:
      # server-dev by name, not a bare `up`: compose treats a service with no
      # profile as always active, so a bare one would also start the two
      # services Coolify deploys -- with nothing to substitute for their
      # password. Naming this one starts it and its depends_on and nothing
      # else. See the comment in infra/sync/compose.yml.
      - docker compose --project-directory . -f infra/dev/compose.yml up -d --build server-dev
      # Quoted whole. Without the outer quotes YAML sees the ": " in
      # "(signup token: ...)" and reads the line as a mapping rather than a
      # string, and task then refuses the file with "invalid keys in command"
      # -- which is a broken Taskfile, not a broken task, and takes the build
      # with it.
      - 'echo "sync server on http://localhost:8080 (signup token: devdevdevdevdevdevdevdevdev)"'

  sync:down:
    summary: Stops the local sync server and discards its database
    cmds:
      # By name for the same reason, and `down` is enough to discard the
      # database: it lives in tmpfs, not in the named volume the deployment
      # uses.
      - docker compose --project-directory . -f infra/dev/compose.yml down

  sync:logs:
    summary: Follows the local sync server's log
    cmds:
      - docker compose --project-directory . -f infra/dev/compose.yml logs -f server-dev

  sync:test:
    summary: Runs the sync server's tests against the local Postgres
    desc: |
      The store's tests skip themselves unless TEST_DATABASE_URL is set --
      which is the right default and a bad surprise. This sets it, and sets
      WORK_REQUIRE_POSTGRES so a database that is configured and unreachable
      fails instead of passing as "nothing to run". Same pair as
      .github/workflows/ci.yml.

      Needs `task sync:up` first: the database it points at is that stack's.
    dir: services/sync
    deps:
      - task: studio:goroot:check
    env:
      # 127.0.0.1 rather than localhost, for the reason ci.yml gives: the port
      # is published on IPv4 only, and a resolver answering ::1 first turns
      # this into a connection refused that reads like a broken test.
      TEST_DATABASE_URL: postgres://work:work@127.0.0.1:5432/work_test?sslmode=disable
      WORK_REQUIRE_POSTGRES: "1"
    cmds:
      - go test -race -count=1 ./...

  charted:up:
    summary: Starts Charted and its Postgres, on :8081
    desc: |
      Brings up the Charted half of infra/dev/compose.yml: the site on
      http://localhost:8081 and its own Postgres on 127.0.0.1:5433. The write
      token is the word "dev", which is what documentation mode publishes with
      against a local instance.

      A second database from the sync server's on purpose -- the two deploy and
      migrate separately. The data is in tmpfs, so `task charted:down` is also
      how you reset it.
    cmds:
      - docker compose --project-directory . -f infra/dev/compose.yml up -d --build charted-dev
      - 'echo "charted on http://localhost:8081 (write token: dev)"'

  charted:down:
    summary: Stops Charted and discards its database
    cmds:
      - docker compose --project-directory . -f infra/dev/compose.yml down charted-dev charted-postgres-dev

  charted:logs:
    summary: Follows Charted's log
    cmds:
      - docker compose --project-directory . -f infra/dev/compose.yml logs -f charted-dev
