# Cuts a release from main, with no version to bump by hand.
#
# The version is derived rather than written down: the newest `v*` tag decides
# it, the patch number goes up by one, and that number is the tag, the
# -X main.version stamp in the binary and what internal/update compares
# against. So a running Work cannot report a version with no release behind it,
# and nobody has to remember to edit a line before pushing.
#
# Every push to main that can change the binary therefore publishes a release,
# and every running Work asks about it once and then nags until it is taken.
# Two things keep that from being unbearable:
#
#   * paths-ignore below, so a README or a note-to-self does not ship a build.
#   * `[skip release]` in the *subject* of the head commit, for the pushes the
#     path filter cannot know about. Subject only, deliberately: a body that
#     describes this mechanism would otherwise skip its own release, which is
#     exactly what happened the first time.
#
# To jump a minor or major number, tag it by hand and push the tag -- the next
# push continues from there, because the newest tag is the only input.
name: release

on:
  push:
    branches: [main]
    # Changes that cannot end up inside the binary. Frontend sources, Go
    # sources, the build files and the workflow itself are all absent from
    # this list on purpose: each of them changes what ships.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".claude/**"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

# Only what publishing needs: the tag, the release and its assets.
permissions:
  contents: write

# Two pushes landing together must not both compute the same next patch number.
# Queued rather than cancelled: the second run re-reads the tags after the first
# has pushed its own, so it works out the number after it rather than the same
# one. Cancelling instead would drop a commit out of every release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: work out the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags are the input to the whole thing, and a shallow clone has
          # none of them.
          fetch-depth: 0

      - id: next
        name: Increment the newest tag
        env:
          # The first release, when there is no tag to count from.
          SEED_VERSION: "0.1.0"
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # An opt-out for pushes the path filter cannot classify: a comment
          # rewrite, a test-only change, anything not worth interrupting people
          # over.
          #
          # The subject line only, not the whole message. A commit body is
          # prose, and prose about the release process quotes the token -- the
          # commit that introduced this check skipped its own release by
          # explaining itself. Asking for the skip means putting it in the one
          # line that is a summary of intent.
          subject=$(printf '%s' "$HEAD_MESSAGE" | head -n 1)
          if printf '%s' "$subject" | grep -qiF '[skip release]'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Head commit says \`[skip release]\`; nothing published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Already released. Happens on a re-run of a finished run, and on a
          # hand-pushed tag that lands on main's tip. Publishing again would
          # mean a second release of one commit under two version numbers.
          if existing=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1) && [ -n "$existing" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "HEAD is already released as $existing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Newest by version order, not by date: a tag pushed late for an old
          # version must not decide what comes next.
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 || true)

          if [ -z "$latest" ]; then
            version="$SEED_VERSION"
            echo "No v* tag yet; seeding at $version." >> "$GITHUB_STEP_SUMMARY"
          else
            core=${latest#v}
            # Drop any prerelease or build suffix: the next release is a plain
            # patch bump of the core version, not a continuation of an rc.
            core=${core%%-*}
            core=${core%%+*}
            IFS='.' read -r major minor patch <<<"$core"
            : "${major:=0}" "${minor:=0}" "${patch:=0}"
            case "$major$minor$patch" in
              ''|*[!0-9]*)
                echo "::error::newest tag $latest is not vMAJOR.MINOR.PATCH; cannot work out the next version"
                exit 1
                ;;
            esac
            version="$major.$minor.$((patch + 1))"
            echo "Newest tag is $latest; releasing $version." >> "$GITHUB_STEP_SUMMARY"
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag exists already; refusing to publish over it"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.goarch }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      # A release with only half its platforms in it is worse than no release:
      # internal/update looks for the asset matching the machine it is running
      # on, and a missing one is a failed update rather than a skipped one.
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          # Native arm64 rather than cross-compiling: the Wails backend is cgo
          # against gtk+-3.0 and webkit2gtk-4.1, so cross-building it needs a
          # whole sysroot of arm64 GTK headers. A second runner is free on a
          # public repository and needs no cross toolchain at all.
          - runner: ubuntu-24.04-arm
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK and WebKit
        # The libraries pkg-config resolves for the Linux backend; see
        # pkg/application/linux_cgo_gtk3.go in Wails.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so the toolchain here and locally cannot drift.
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        # Pinned to the version in go.mod: the CLI generates the bindings the
        # frontend imports, so a newer CLI than the library is a way to get a
        # frontend that does not compile against the backend it shipped with.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18

      - name: Build
        env:
          # Read by build:release, which stamps it in as main.version.
          VERSION: ${{ needs.version.outputs.version }}
        # No GOARCH here: each runner builds for itself, and build:release sets
        # GOARCH from the host architecture, which would override this anyway.
        # matrix.goarch names the artifact; the runner decides the target.
        run: wails3 task build:release OUTPUT=bin/work-linux-${{ matrix.goarch }}

      - name: Check the version went in
        # A silently unstamped binary would ship as a development build and
        # never check for an update again, which is exactly the failure nobody
        # notices.
        run: |
          set -euo pipefail
          bin=bin/work-linux-${{ matrix.goarch }}
          test -x "$bin"
          if ! grep -qF "${{ needs.version.outputs.version }}" "$bin"; then
            echo "::error::$bin does not contain ${{ needs.version.outputs.version }}; the -X main.version stamp did not take"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: work-linux-${{ matrix.goarch }}
          path: bin/work-linux-${{ matrix.goarch }}
          if-no-files-found: error
          # Already a compressed-as-it-gets stripped binary.
          compression-level: 0

  release:
    name: publish ${{ needs.version.outputs.tag }}
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksum list
        # internal/update refuses to install a binary that is not in this file,
        # so it is part of the release rather than a nicety. The format is
        # sha256sum's own; see FindChecksum in internal/update/apply.go.
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum work-linux-* > checksums.txt
          cat checksums.txt

      - name: Tag ${{ needs.version.outputs.tag }}
        env:
          TAG: ${{ needs.version.outputs.tag }}
        # No --force anywhere: if something else claimed this tag between the
        # version job and here, the push is rejected and the run fails rather
        # than moving a tag people may already have downloaded.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/work-linux-amd64 \
            dist/work-linux-arm64 \
            dist/checksums.txt
